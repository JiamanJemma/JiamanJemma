<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 泥塑鱼动效测试</title>
  <style>
    body { background: #e0d4f0; margin: 0; overflow: hidden; font-family: sans-serif; }
    #info { position: absolute; padding: 20px; color: #5b21b6; z-index: 100; background: rgba(255,255,255,0.7); border-radius: 0 0 15px 0; }
    
    .fish-wrapper {
      position: absolute;
      width: 150px;
      height: 150px;
      /* 开启 3D 空间 */
      transform-style: preserve-3d;
      perspective: 800px;
      pointer-events: none;
      will-change: transform, left, top;
    }

    .fish-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      /* 基础立体阴影 */
      filter: drop-shadow(0px 15px 20px rgba(100,70,150,0.3));
      /* 叠加双重动画：果冻扭动 + 呼吸浮动 */
      animation: squish 2s infinite ease-in-out, breathe 4s infinite ease-in-out;
      transform-origin: center center;
      will-change: transform, filter;
    }

    /* 模拟由于水流和肌肉产生的 3D 扭曲（果冻泥塑感） */
    @keyframes squish {
      0%, 100% { transform: scale(1, 1) skew(0deg, 0deg) rotateY(0deg) rotateX(0deg); }
      25% { transform: scale(1.05, 0.95) skew(2deg, 2deg) rotateY(18deg) rotateX(5deg); }
      50% { transform: scale(1, 1) skew(0deg, 0deg) rotateY(0deg) rotateX(0deg); }
      75% { transform: scale(0.95, 1.05) skew(-2deg, -2deg) rotateY(-18deg) rotateX(-5deg); }
    }

    /* 模拟呼吸时的轻微起伏和阴影变化，增强厚度感 */
    @keyframes breathe {
      0%, 100% { filter: drop-shadow(0px 15px 20px rgba(100,70,150,0.3)) brightness(1); }
      50% { filter: drop-shadow(0px 25px 30px rgba(100,70,150,0.15)) brightness(1.08); }
    }
  </style>
</head>
<body>
  <div id="info">
    <h2>3D 泥塑游动动效体验</h2>
    <p>不好意思，刚才那个引了第三方代码崩了。<br>现在这个是纯原生写的。</p>
    <p>你看紫甲（河豚）在游动时的：<br>1. 身体的**果冻拉伸感 (Squish)**<br>2. 空间里的**3D 倾斜 (rotateY)**<br>3. 随着呼吸变化的**动态厚度阴影**</p>
    <p id="err" style="color:red;"></p>
  </div>
  
  <div class="fish-wrapper" id="fish">
    <img src="clay_pufferfish.png" class="fish-img" alt="fish" onerror="document.getElementById('err').textContent='图片加载失败，请检查 clay_pufferfish.png 是否存在。'">
  </div>

  <script>
    const fish = document.getElementById('fish');
    let angle = 0;
    
    function animate() {
      angle += 0.015;
      
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;
      
      // 游动轨迹：一个无限大的 8 字形 (Lissajous curve)
      const x = cx + Math.sin(angle) * (window.innerWidth * 0.35);
      const y = cy + Math.sin(angle * 2) * (window.innerHeight * 0.25);
      
      // 计算游动方向的角度 (切线方向)
      const dx = Math.cos(angle) * (window.innerWidth * 0.35);
      const dy = Math.cos(angle * 2) * 2 * (window.innerHeight * 0.25);
      const rot = Math.atan2(dy, dx) * (180 / Math.PI);
      
      // 保证鱼总是正着身子（不肚子朝上）
      let flip = 1;
      let displayRot = rot;
      
      if (Math.cos(rot * Math.PI / 180) < 0) {
        // 向左游的时候，翻转 Y 轴
        flip = -1;
        displayRot += 180;
      }

      fish.style.left = (x - 75) + 'px';
      fish.style.top = (y - 75) + 'px';
      // 注意：这里的 translateZ 配合 perspective 让鱼看起来有景深感
      fish.style.transform = `rotate(${displayRot}deg) scaleY(${flip}) translateZ(50px)`;
      
      requestAnimationFrame(animate);
    }
    
    animate();
  </script>
</body>
</html>
