<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jemma Private Studio</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="../style.css?v=20260417-private">
</head>
<body data-theme="dark">
  <div class="bg-gradient"></div>
  <main class="private-page">
    <section class="private-shell">
      <p class="private-kicker">Private Studio</p>
      <h1 class="private-title">只给你自己的入口</h1>
      <p class="private-copy">
        这是挂在主站下面的一条私密链路，适合放你自己的工作台入口、草稿导航、
        内部工具链接，或者任何你不想公开给所有访问者看的页面。
      </p>
      <div class="private-grid">
        <a class="private-card" href="https://jiamanjemma.com">
          <span class="private-card-label">Public Site</span>
          <strong>回到主页</strong>
          <p>继续看公开内容、作品、文章和资源。</p>
        </a>
        <a class="private-card" href="https://jemma747318.substack.com/" target="_blank" rel="noopener noreferrer">
          <span class="private-card-label">Writing</span>
          <strong>进入 Newsletter</strong>
          <p>继续写文章，或者处理发布与订阅反馈。</p>
        </a>
        <a class="private-card" href="mailto:jiamanjemma@gmail.com">
          <span class="private-card-label">Inbox</span>
          <strong>快速打开邮箱</strong>
          <p>把这里当成你自己的网页起点，而不是访客入口。</p>
        </a>
      </div>
      <div class="private-note">
        <strong>部署后记得设置环境变量：</strong>
        <code>PRIVATE_USER</code> 和 <code>PRIVATE_PASS</code>
      </div>
    </section>
  </main>
</body>
</html>
