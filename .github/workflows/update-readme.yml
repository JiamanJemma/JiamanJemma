name: Update README with Latest Content

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Update README
        env:
          YOUTUBE_FEED_URL: https://www.youtube.com/feeds/videos.xml?channel_id=UCSrk3Zvkt5pP2I04WfQVxsw
          ARTICLE_FEED_URL: https://jemma747318.substack.com/feed
          WEBSITE_URL: https://jiamanjemma.com
          VIDEO_COUNT: 5
          ARTICLE_COUNT: 5
        run: npm run update-profile

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update profile content"
          git push
